[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcost"
version = "0.1.0"
description = "Tiny AI agent cost & budget governor. Per-task monetary budget + circuit breaker + cost-of-pass."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Obai Jahjah / BOBA"}]
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.scripts]
agentcost = "agentcost.cli:main"

[tool.setuptools]
packages = ["agentcost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
